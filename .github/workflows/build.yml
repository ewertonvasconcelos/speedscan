name: Build SpeedScan

on:
  push:
    tags:
      - 'v*'          # Executa quando uma tag com 'v' for criada (ex: v1.0.0)
  workflow_dispatch:   # Permite executar manualmente pelo site do GitHub

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv libfuse2 smartmontools lm-sensors

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller (Linux)
        run: |
          pyinstaller --onefile --windowed --name SpeedScan core/main.py

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: SpeedScan-linux
          path: dist/SpeedScan

      - name: Create AppImage (opcional)
        run: |
          # Baixa linuxdeploy e cria AppImage
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv SpeedScan*.AppImage dist/
        continue-on-error: true

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SpeedScan-linux-appimage
          path: dist/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller (Windows)
        run: |
          pyinstaller --onefile --windowed --name SpeedScan core/main.py

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: SpeedScan-windows
          path: dist/SpeedScan.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller (macOS)
        run: |
          pyinstaller --onefile --windowed --name SpeedScan core/main.py

      - name: Upload artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: SpeedScan-macos
          path: dist/SpeedScan

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpeedScan-linux/SpeedScan
            SpeedScan-linux-appimage/*.AppImage
            SpeedScan-windows/SpeedScan.exe
            SpeedScan-macos/SpeedScan
          generate_release_notes: true

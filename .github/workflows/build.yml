name: Build Linux Packages

on:
  push:
    tags:
      - 'v*'  # Executa apenas quando uma tag como v1.0.0 for criada

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name SpeedScan core/main.py

      - name: Create .deb package
        run: |
          # Cria estrutura de diretórios
          mkdir -p package/DEBIAN
          mkdir -p package/usr/local/bin
          # Copia o executável (gerado pelo PyInstaller)
          cp dist/SpeedScan package/usr/local/bin/speedscan
          # Extrai a versão da tag (remove o 'v' inicial)
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Cria arquivo de controle (substitua o e-mail pelo seu)
          echo "Package: speedscan" > package/DEBIAN/control
          echo "Version: $VERSION" >> package/DEBIAN/control
          echo "Architecture: amd64" >> package/DEBIAN/control
          echo "Maintainer: Ewerton Vasconcelos <seu-email@example.com>" >> package/DEBIAN/control
          echo "Description: SpeedScan - All-in-one system diagnostic and optimization tool" >> package/DEBIAN/control
          # Gera o .deb (a flag --root-owner-group evita o aviso de rootless)
          dpkg-deb --root-owner-group --build package speedscan_${VERSION}_amd64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedscan-deb-package
          path: speedscan_*.deb

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: speedscan_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

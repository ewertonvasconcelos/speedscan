name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install flake8 black isort
      - name: Run linters
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --max-line-length=100 --statistics

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install pytest customtkinter matplotlib psutil requests numpy
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  build-appimage:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder-*
          ./appimage-builder-* --recipe AppImageBuilder.yml 2>/dev/null || echo "AppImage builder skipped - missing config"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedScan-Linux
          path: |
            *-x86_64.AppImage
            *.AppImage

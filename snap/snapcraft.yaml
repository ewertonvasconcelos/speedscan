name: speedscan
version: '0.1.0-beta'
summary: Ferramenta de diagnóstico e otimização de sistema
description: |
  SpeedScan é uma ferramenta all-in-one para monitoramento e otimização de sistema,
  com suporte a IA proativa, scanner de rede, gráficos históricos e muito mais.
  Este é o pacote snap com o executável pré-compilado.

grade: stable
confinement: strict
base: core22

apps:
  speedscan:
    command: bin/speedscan
    plugs:
      - home
      - network
      - network-bind
      - system-observe
      - hardware-observe
      - process-control
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  speedscan:
    plugin: dump
    source: snap/stage/
    organize:
      bin/speedscan: bin/speedscan
    stage-packages:
      - python3-tk
      - python3-pil
      - python3-pil.imagetk
      - libgtk-3-0
      - libcairo2
      - libgdk-pixbuf2.0-0
      - libglib2.0-0
      - shared-mime-info
      - fonts-dejavu-core

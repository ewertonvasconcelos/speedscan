app-id: io.github.ewertonvasconcelos.speedscan
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: speedscan
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app customtkinter psutil Pillow matplotlib requests speedtest-cli ollama
  - name: speedscan
    buildsystem: simple
    build-commands:
      - install -Dm755 core/main.py /app/bin/speedscan
      - cp -r core /app/lib/python3.11/site-packages/
      - cp -r assets /app/share/speedscan/
    sources:
      - type: dir
        path: .
